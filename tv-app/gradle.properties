org.gradle.caching=true
# NOTE: org.gradle.jvmargs is deliberately unset. Setting it forces Gradle to fork
# a single-use daemon to honour the JVM args, which needs a loopback socket.
# Re-add it if you hit OOM during a build and loopback is available.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
